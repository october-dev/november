<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="288" viewBox="0 0 1080 288" role="img" aria-labelledby="title description">
  <title id="title">November</title>
  <desc id="description">November in blue-to-cyan block ASCII lettering on a midnight-blue circuit board. October's hardware agent harness.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060e1b"/>
      <stop offset="1" stop-color="#0b203b"/>
    </linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="74" y1="0" x2="1006" y2="0">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.45" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 H 0 V 24" fill="none" stroke="#60a5fa" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="1079" height="287" rx="16" fill="url(#background)" stroke="#203d60"/>
  <rect x="1" y="1" width="1078" height="286" rx="16" fill="url(#grid)"/>

  <g font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2">
    <text x="74" y="37" fill="#7ca5d2">OCTOBER / HARDWARE</text>
    <text x="1006" y="37" fill="#7ca5d2" text-anchor="end">DESIGN / 001</text>
  </g>

  <!-- Monospaced source stays selectable and reusable in a terminal. -->
  <g fill="url(#blue)" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" xml:space="preserve">
    <text x="74" y="86" textLength="932" lengthAdjust="spacingAndGlyphs">███╗  ██╗  ██████╗  ██╗   ██╗ ███████╗  ███╗   ███╗ ██████╗   ███████╗  ██████╗  </text>
    <text x="74" y="107" textLength="932" lengthAdjust="spacingAndGlyphs">████╗ ██║ ██╔═══██╗ ██║   ██║ ██╔════╝  ████╗ ████║ ██╔══██╗  ██╔════╝  ██╔══██╗ </text>
    <text x="74" y="128" textLength="932" lengthAdjust="spacingAndGlyphs">██╔██╗██║ ██║   ██║ ██║   ██║ █████╗    ██╔████╔██║ ██████╔╝  █████╗    ██████╔╝ </text>
    <text x="74" y="149" textLength="932" lengthAdjust="spacingAndGlyphs">██║╚████║ ██║   ██║ ╚██╗ ██╔╝ ██╔══╝    ██║╚██╔╝██║ ██╔══██╗  ██╔══╝    ██╔══██╗ </text>
    <text x="74" y="170" textLength="932" lengthAdjust="spacingAndGlyphs">██║ ╚███║ ╚██████╔╝  ╚████╔╝  ███████╗  ██║ ╚═╝ ██║ ██████╔╝  ███████╗  ██║  ██║ </text>
    <text x="74" y="191" textLength="932" lengthAdjust="spacingAndGlyphs">╚═╝  ╚══╝  ╚═════╝    ╚═══╝   ╚══════╝  ╚═╝     ╚═╝ ╚═════╝   ╚══════╝  ╚═╝  ╚═╝ </text>
  </g>

  <g stroke="url(#blue)" stroke-width="1.5" fill="#09182b">
    <path d="M 74 219 H 1006" fill="none" opacity="0.65"/>
    <circle cx="120" cy="219" r="4"/>
    <circle cx="235" cy="219" r="4"/>
    <circle cx="350" cy="219" r="4"/>
    <circle cx="465" cy="219" r="4"/>
    <circle cx="592" cy="219" r="4"/>
    <circle cx="730" cy="219" r="4"/>
    <circle cx="845" cy="219" r="4"/>
    <circle cx="960" cy="219" r="4"/>
    <path d="M 120 223 V 234 L 131 245 H 160 M 960 215 V 204 L 972 192 H 1024" fill="none" opacity="0.4"/>
  </g>

  <text x="540" y="262" fill="#8db8e4" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="3" text-anchor="middle">SERIAL / GPIO / I2C / SPI / MQTT</text>
</svg>
